name: Build Gallery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check imports and interaction behavior
        run: bash Scripts/check.sh
      - name: Build Universal application
        env:
          GALLERY_UNIVERSAL: '1'
        run: bash Scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-macOS
          path: dist/Gallery-macOS.zip
      # Releases are published after desktop regression checks and review of
      # the signed artifact. A main-branch push must not publish a preview.
